name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download Quran data
        run: |
          pip install requests
          python tools/download_quran.py

      - name: Create Flutter project and copy files
        run: |
          flutter create --org com.example --project-name quran_notifier build_app
          cp pubspec.yaml build_app/pubspec.yaml
          cp lib/main.dart build_app/lib/main.dart
          mkdir -p build_app/assets
          cp assets/quran.json build_app/assets/quran.json

      - name: Patch Android config
        working-directory: build_app
        run: python ../tools/patch_android.py

      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink

      - name: Verify APK is not obfuscated (Gson TypeToken must survive)
        run: |
          mkdir -p /tmp/apkcheck
          unzip -o -q build_app/build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' -d /tmp/apkcheck
          if grep -a -q "Lcom/google/gson/reflect/TypeToken;" /tmp/apkcheck/classes*.dex; then
            echo "OK: APK is safe (TypeToken class kept)"
          else
            echo "ERROR: R8 obfuscated Gson -> notifications would crash with 'Missing type parameter'"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: quran-apk-run${{ github.run_number }}
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
