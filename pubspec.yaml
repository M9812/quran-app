publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # نسخه عمداً ثابت شده تا API تغییر نکند
  flutter_local_notifications: 17.2.4
